
<div class="promptHead" resource="label.cloneFile">placeholder</div>
    
<form accept-charset="utf-8" name="cloneForm" id="cloneForm" method="get" action="/webfilesys/servlet" style="display:inline;">
  <input type="hidden" name="command" value="cloneFile" />
  <input type="hidden" id="sourceFileName" name="sourceFileName" />

  <table border="0" width="100%" cellpadding="10" style="margin-top:10px">
    <tr>
      <td class="formParm1" nowrap="nowrap">
	    <span resource="label.cloneSource" />:
      </td>
      <td class="formParm2" width="70%">
          <span id="shortFileName"></span>
      </td>
    </tr>
    <tr>
      <td class="formParm1" nowrap="nowrap">
	    <span resource="label.newname" />:
      </td>
      <td class="formParm2" width="80%">
        <input type="text" id="newFileName" name="newFileName" maxlength="256" style="width:220px;" />
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <input type="button" resource="button.clone" onclick="validateCloneFileName()" style="float:left" />
        <input type="button" resource="button.cancel" onclick="hidePrompt()" style="float:right" />
      </td>
    </tr>
  </table>
  
</form>
