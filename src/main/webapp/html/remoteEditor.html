<html>
  <head>
  <title>WebFileSys remoteEditior</title>
    <link rel="stylesheet" type="text/css" href="/webfilesys/styles/common.css">
    <link rel="stylesheet" type="text/css" href="/webfilesys/styles/skins/dark.css">
    <script src="/webfilesys/javascript/browserCheck.js" type="text/javascript"></script>
    <script src="/webfilesys/javascript/ajaxCommon.js" type="text/javascript"></script>
    <script src="/webfilesys/javascript/remoteEditor.js" type="text/javascript"></script>
    <script src="/webfilesys/javascript/resourceBundle.js" type="text/javascript"></script>
    <script src="/webfilesys/javascript/util.js" type="text/javascript"></script>
    <script src="/webfilesys/servlet?command=getResourceBundle" type="text/javascript"></script>
  </head>
  <body class="remoteEditor" onload="initRemoteEditor()">
    <div id="headline" class="headline"></div>

    <form id="editForm" accept-charset="utf-8" method="post" action="/webfilesys/servlet" style="margin-top:20px">
      <input type="hidden" name="command" value="saveRemoteEditor">
      <input type="hidden" id="fileName" name="fileName" />
      <input type="hidden" id="linkName" name="linkName" />

      <textarea id="editorText" name="text" rows="18" cols="60"
                style="width:100%;height:580px;font-family:monospace;" wrap="hard">
      </textarea>

      <div id="editorButtonCont" class="editorButtonCont">
        <input type="button" onclick="saveEditorContent(false)" resource="button.save" />
        <input type="button" onclick="saveEditorContent(true)" resource="button.saveAndClose" />
        <input type="button" onclick="cancelRemoteEdit()" resource="button.cancel" style="float:right" />
      </div>
    </form>
  </body>
</html>
