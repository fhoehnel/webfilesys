<div class="promptHead" resource="label.driveinfo">placeholder</div>

<table border="0" width="100%" cellpadding="10">

    <tr>
        <td class="formParm1" nowrap="nowrap">
            <span resource="label.drive"></span>:
        </td>
    </tr>
    <tr>
        <td id="drivePath" class="formParm2">
        </td>
    </tr>

    <tr>
        <td class="formParm1" nowrap="nowrap">
            <span resource="label.driveType"></span>:
        </td>
    </tr>
    <tr>
        <td id="driveType" class="formParm2">
        </td>
    </tr>

    <tr>
        <td class="formParm1" nowrap="nowrap">
            <span resource="label.drivelabel"></span>:
        </td>
    </tr>
    <tr>
        <td id="driveLabel" class="formParm2">
        </td>
    </tr>

    <tr>
        <td class="formParm1" nowrap="nowrap">
            <span resource="label.diskTotalSpace"></span>:
        </td>
    </tr>
    <tr>
        <td id="totalDiskSpace" class="formParm2">
        </td>
    </tr>

    <tr>
        <td class="formParm1" nowrap="nowrap">
            <span resource="label.bytesfree"></span>:
        </td>
    </tr>
    <tr>
        <td id="freeDiskSpace" class="formParm2">
        </td>
    </tr>

    <tr>
        <td class="formParm1" nowrap="nowrap">
            <span id="percentUsed"></span><span resource="label.percentUsed"></span>
        </td>
    </tr>

    <tr>
        <td colspan="2">
            <div class="driveUsageBar">
                <img id="imgUsed" src="/webfilesys/images/bluedot.gif" />
            </div>
        </td>
    </tr>

    <tr>
        <td colspan="2" style="text-align:center">
            <input type="button" resource="button.closewin" onclick="hidePrompt()" />
        </td>
    </tr>
</table>
