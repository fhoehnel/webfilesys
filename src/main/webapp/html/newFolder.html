<div class="promptHead" resource="label.mkdir"></div>
<form accept-charset="utf-8" name="mkdirForm" id="mkdirForm" method="get" action="/webfilesys/servlet">
    <input type="hidden" name="command" value="mkdir">
    <input id="currentPath" type="hidden" name="actpath" value="C:\temp">
    <table style="width:100%">
        <tbody>
        <tr>
            <td class="formParm1">
                <span resource="label.parentDir">Basis-Ordner</span>
            </td>
        </tr>
        <tr>
            <td class="formParm2"><span id="currentFolder"></span></td>
        </tr>
        <tr>
            <td class="formParm1" nowrap="nowrap">
                <span resource="label.newDirName"></span>
            </td>
        </tr>
        <tr>
            <td class="formParm2">
                <input id="newFolderName" type="text" name="NewDirName" maxlength="256" placeholder="new dir name" style="width:100%;">
            </td>
        </tr>
        <tr>
            <td>
                <input type="button" resource="button.create" onclick="validateNewFolderName(resourceBundle['alert.illegalCharInFilename'])"/>
                <input type="button" resource="button.cancel" style="float:right" onclick="hidePrompt()"/>
            </td>
        </tr>
        </tbody>
    </table>
</form>
